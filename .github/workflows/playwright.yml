name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        # Excludes the `setup` project: it requires BEARSTORE_USERNAME/BEARSTORE_PASSWORD,
        # which aren't configured as CI secrets yet, and nothing currently depends on it.
        run: npx playwright test --project=chromium --project=firefox --project=webkit --project=api
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
